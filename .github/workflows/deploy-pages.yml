name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
    paths-ignore:
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  import:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    outputs:
      imported: ${{ steps.archive.outputs.found }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Detect one-time source archive
        id: archive
        shell: bash
        run: |
          if [[ -f psefizma-source.zip ]]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Import prepared project tree
        if: steps.archive.outputs.found == 'true'
        shell: bash
        run: |
          mkdir .source-import
          unzip -q psefizma-source.zip -d .source-import
          cp -a .source-import/. .
          rm -rf .source-import
          rm psefizma-source.zip

      - name: Commit imported source
        if: steps.archive.outputs.found == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add complete AR experience"
          git push

      - name: Start Pages deployment
        if: steps.archive.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh workflow run deploy-pages.yml --ref main

  build:
    needs: import
    if: needs.import.outputs.imported != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Set repository base path
        run: echo "NEXT_PUBLIC_BASE_PATH=/${GITHUB_REPOSITORY#*/}" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: npm run build:pages

      - name: Verify static export
        run: test -f dist/client/index.html

      - name: Preserve generated asset paths
        run: touch dist/client/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist/client
          include-hidden-files: true

  deploy:
    needs: build
    if: needs.build.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
